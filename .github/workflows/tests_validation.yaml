name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  validate:
    name: Validate Tests Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          uv run pytest src/tests --cov=src --cov-report=term --cov-report=json --cov-fail-under=80

      - name: Run ruff check
        id: ruff
        continue-on-error: true
        run: uv run ruff check src

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const testsResult = '${{ steps.tests.outcome }}';
            const ruffResult = '${{ steps.ruff.outcome }}';

            const testsIcon = testsResult === 'success' ? '✅' : '❌';
            const ruffIcon = ruffResult === 'success' ? '✅' : '❌';

            const output = `#### 🧪 Test Results

            ${testsIcon} **Tests:** ${testsResult === 'success' ? 'Passed' : 'Failed'}
            ${ruffIcon} **Ruff Check:** ${ruffResult === 'success' ? 'Passed' : 'Failed'}

            **Python Version:** ${{ env.PYTHON_VERSION }}
            **Coverage:** ${testsResult === 'success' ? '> 80% ✅' : 'Below threshold or tests failed ❌'}

            ${testsResult === 'success' && ruffResult === 'success' ? 'Ready for review! 🚀' : 'Please fix the issues above before merging. 🔧'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if tests failed
        if: steps.tests.outcome != 'success' || steps.ruff.outcome != 'success'
        run: exit 1