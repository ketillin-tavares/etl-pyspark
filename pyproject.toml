[project]
name = "desafio-tecnico-luizalabs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.0",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyspark>=4.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.45",
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "responses>=0.25.8",
    "ruff>=0.14.11",
]
